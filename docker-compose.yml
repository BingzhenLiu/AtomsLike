services:
  atomforge:
    build: .
    image: atomforge:local
    ports:
      - "3000:3000"
    # Create the file first: cp .env.example .env
    # Leaving the model variables empty is valid and starts Demo Mode.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    # Mirrors the Dockerfile probe. Declared here as well because builders that
    # emit OCI images (podman's default format) drop HEALTHCHECK from the image.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
